<!DOCTYPE html>
<html>
<head>
    <title>RFP Types Management - ITSS RFPplus</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .rfp-type-card {
            border-left: 4px solid #1F4397;
            transition: all 0.3s ease;
        }
        .rfp-type-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .rfp-type-card.inactive {
            opacity: 0.6;
            border-left-color: #dc3545;
        }
        .type-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
        }
        .stage-pill {
            display: inline-block;
            background: #e9ecef;
            color: #495057;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin: 2px;
        }
        .admin-header {
            background: linear-gradient(135deg, #1F4397 0%, #10224c 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <!-- Include Common Navigation -->
    {% include 'common_navbar.html' %}

    <!-- Admin Header -->
    <div class="admin-header">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <h1 class="display-6 mb-0">
                        <i class="fas fa-tags me-3"></i>RFP Types Management
                    </h1>
                    <p class="lead mb-0">Configure RFP types and their associated workflows</p>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Stats Row -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h3 id="totalTypes" class="text-primary">-</h3>
                        <p class="mb-0">Total Types</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h3 id="activeTypes" class="text-success">-</h3>
                        <p class="mb-0">Active Types</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h3 id="projectsUsingTypes" class="text-info">-</h3>
                        <p class="mb-0">Projects Using</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <button class="btn btn-primary w-100" onclick="showCreateModal()">
                            <i class="fas fa-plus me-1"></i>Add New Type
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- RFP Types List -->
        <div class="row" id="rfpTypesList">
            <!-- RFP Types will be loaded here -->
        </div>
    </div>

    <!-- Create/Edit RFP Type Modal -->
    <div class="modal fade" id="rfpTypeModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add RFP Type</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="rfpTypeForm">
                        <input type="hidden" id="editingTypeId">
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Type Name (Internal) *</label>
                                    <input type="text" class="form-control" id="typeName" required 
                                           placeholder="e.g., implementation" pattern="[a-z_]+">
                                    <div class="form-text">Lowercase letters and underscores only</div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Display Name *</label>
                                    <input type="text" class="form-control" id="displayName" required 
                                           placeholder="e.g., New Implementation">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="3" 
                                      placeholder="Brief description of this RFP type"></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Default Workflow Stages</label>
                            <div class="row">
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="stage_created" value="created" checked disabled>
                                        <label class="form-check-label">Created</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="stage_authorized" value="authorized">
                                        <label class="form-check-label">Authorized</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="stage_validated" value="validated">
                                        <label class="form-check-label">Validated</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="stage_approved" value="approved">
                                        <label class="form-check-label">Approved</label>
                                    </div>
                                </div>
                            </div>
                            <div class="form-text">Select the workflow stages for this RFP type</div>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="isActive" checked>
                                <label class="form-check-label">Active</label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveRFPType()">Save RFP Type</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Action</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="confirmMessage">
                    <!-- Confirmation message will be set dynamically -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmButton">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let rfpTypes = [];
        let editingTypeId = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadRFPTypes();
        });

        async function loadRFPTypes() {
            try {
                const response = await fetch('/api/admin/rfp-types');
                const data = await response.json();

                if (data.success) {
                    rfpTypes = data.rfp_types;
                    displayRFPTypes(rfpTypes);
                    updateStats(data.stats);
                } else {
                    showError('Failed to load RFP types: ' + data.error);
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            }
        }

        function displayRFPTypes(types) {
            const container = document.getElementById('rfpTypesList');
            
            if (types.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fas fa-tags fa-3x text-muted mb-3"></i>
                        <h4 class="text-muted">No RFP types configured</h4>
                        <p class="text-muted">Create your first RFP type to get started</p>
                        <button class="btn btn-primary" onclick="showCreateModal()">
                            <i class="fas fa-plus me-1"></i>Add First RFP Type
                        </button>
                    </div>
                `;
                return;
            }

            let html = '';
            types.forEach(type => {
                html += generateRFPTypeCard(type);
            });
            
            container.innerHTML = html;
        }

        function generateRFPTypeCard(type) {
            const statusClass = type.is_active ? '' : 'inactive';
            const statusBadge = type.is_active ? 
                '<span class="badge bg-success">Active</span>' : 
                '<span class="badge bg-danger">Inactive</span>';

            const stagesHtml = type.default_workflow_stages.map(stage => 
                `<span class="stage-pill">${stage.replace('_', ' ').toUpperCase()}</span>`
            ).join('');

            return `
                <div class="col-md-6 mb-3">
                    <div class="card rfp-type-card ${statusClass}">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div>
                                    <h6 class="mb-1">${type.display_name}</h6>
                                    <code class="text-muted">${type.type_name}</code>
                                </div>
                                <div>
                                    ${statusBadge}
                                </div>
                            </div>
                            
                            <p class="text-muted mb-3">${type.description || 'No description provided'}</p>
                            
                            <div class="mb-3">
                                <small class="text-muted d-block mb-1">Workflow Stages:</small>
                                ${stagesHtml}
                            </div>
                            
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <small class="text-muted d-block">
                                        <i class="fas fa-project-diagram me-1"></i>
                                        ${type.project_count || 0} projects using
                                    </small>
                                    <small class="text-muted">
                                        <i class="fas fa-list-check me-1"></i>
                                        ${type.template_count || 0} checklist template(s)
                                    </small>
                                </div>
                                <div>
                                    <button class="btn btn-sm btn-outline-success me-1" 
                                            onclick="manageChecklists('${type.type_name}', '${type.display_name}')"
                                            title="Manage Checklist Templates">
                                        <i class="fas fa-list-check"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-primary me-1" 
                                            onclick="editRFPType('${type.id}')">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" 
                                            onclick="deleteRFPType('${type.id}', '${type.display_name}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateStats(stats) {
            document.getElementById('totalTypes').textContent = stats.total;
            document.getElementById('activeTypes').textContent = stats.active;
            document.getElementById('projectsUsingTypes').textContent = stats.projects_using;
        }

        function showCreateModal() {
            editingTypeId = null;
            document.getElementById('modalTitle').textContent = 'Add RFP Type';
            document.getElementById('rfpTypeForm').reset();
            document.getElementById('isActive').checked = true;
            document.getElementById('stage_created').checked = true;
            new bootstrap.Modal(document.getElementById('rfpTypeModal')).show();
        }

        function editRFPType(typeId) {
            const type = rfpTypes.find(t => t.id == typeId);
            if (!type) return;

            editingTypeId = typeId;
            document.getElementById('modalTitle').textContent = 'Edit RFP Type';
            document.getElementById('typeName').value = type.type_name;
            document.getElementById('displayName').value = type.display_name;
            document.getElementById('description').value = type.description || '';
            document.getElementById('isActive').checked = type.is_active;

            // Set workflow stages
            const stages = ['created', 'authorized', 'validated', 'approved'];
            stages.forEach(stage => {
                const checkbox = document.getElementById('stage_' + stage);
                if (checkbox) {
                    checkbox.checked = type.default_workflow_stages.includes(stage);
                }
            });

            new bootstrap.Modal(document.getElementById('rfpTypeModal')).show();
        }

        async function saveRFPType() {
            const form = document.getElementById('rfpTypeForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const stages = [];
            const stageCheckboxes = ['created', 'authorized', 'validated', 'approved'];
            stageCheckboxes.forEach(stage => {
                const checkbox = document.getElementById('stage_' + stage);
                if (checkbox && checkbox.checked) {
                    stages.push(stage);
                }
            });

            const data = {
                type_name: document.getElementById('typeName').value,
                display_name: document.getElementById('displayName').value,
                description: document.getElementById('description').value,
                default_workflow_stages: stages,
                is_active: document.getElementById('isActive').checked
            };

            try {
                const url = editingTypeId ? 
                    `/api/admin/rfp-types/${editingTypeId}` : 
                    '/api/admin/rfp-types';
                const method = editingTypeId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    bootstrap.Modal.getInstance(document.getElementById('rfpTypeModal')).hide();
                    loadRFPTypes(); // Reload the list
                } else {
                    showError('Failed to save RFP type: ' + result.error);
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            }
        }

        function deleteRFPType(typeId, displayName) {
            document.getElementById('confirmMessage').innerHTML = 
                `Are you sure you want to delete the RFP type "<strong>${displayName}</strong>"? This action cannot be undone.`;
            
            document.getElementById('confirmButton').onclick = async function() {
                try {
                    const response = await fetch(`/api/admin/rfp-types/${typeId}`, {
                        method: 'DELETE'
                    });

                    const result = await response.json();
                    if (result.success) {
                        bootstrap.Modal.getInstance(document.getElementById('confirmModal')).hide();
                        loadRFPTypes(); // Reload the list
                    } else {
                        showError('Failed to delete RFP type: ' + result.error);
                    }
                } catch (error) {
                    showError('Network error: ' + error.message);
                }
            };

            new bootstrap.Modal(document.getElementById('confirmModal')).show();
        }

        function manageChecklists(rfpType, displayName) {
            // Open checklist templates management for this RFP type
            window.open(`/admin/checklist-templates?rfp_type=${rfpType}`, '_blank');
        }

        function showError(message) {
            console.error(message);
            // You can integrate with a toast library or use alerts
            alert('Error: ' + message);
        }
    </script>
</body>
</html>
