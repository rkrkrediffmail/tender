<!DOCTYPE html>
<html>
<head>
    <title>Generated Proposals - {{ project.name }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/itss-theme.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
        }
        .navbar {
            background: linear-gradient(135deg, #1F4397 0%, #10224c 100%);
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .proposal-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .proposal-info h4 {
            margin: 0 0 10px 0;
            color: #495057;
        }
        .proposal-info p {
            margin: 5px 0;
            color: #6c757d;
        }
        .proposal-actions {
            display: flex;
            gap: 10px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .no-proposals {
            text-align: center;
            padding: 40px;
            background: #fff3cd;
            border-radius: 8px;
        }
        .btn {
            background: #1F4397;
            border: none;
        }
        .btn:hover {
            background: #10224c;
        }
        .btn-success {
            background: #28a745;
        }
        .btn-success:hover {
            background: #218838;
        }
        .btn-danger {
            background: #dc3545;
        }
        .btn-danger:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-brain me-2"></i>ITSS RFPplus
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/projects">Projects</a>
                <a class="nav-link" href="/analysis/{{ project.id }}">Analysis</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1><i class="fas fa-file-pdf me-2"></i>Generated Proposals</h1>
                <p class="text-muted">Project: {{ project.name }}</p>
            </div>
            <div>
                <a href="/analysis/{{ project.id }}" class="btn btn-primary">
                    <i class="fas fa-arrow-left me-2"></i>Back to Analysis
                </a>
                <a href="/generate-proposal/{{ project.id }}" class="btn btn-success">
                    <i class="fas fa-plus me-2"></i>Generate New
                </a>
            </div>
        </div>

        <div id="proposalsList" class="loading">
            <h3><i class="fas fa-spinner fa-spin me-2"></i>Loading proposals...</h3>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    async function loadProposals() {
        try {
            const projectId = "{{ project.id }}";
            const response = await fetch(`/api/proposal-status/${projectId}`);
            const data = await response.json();

            const proposalsList = document.getElementById('proposalsList');

            if (data.proposal_count === 0) {
                proposalsList.innerHTML = `
                    <div class="no-proposals">
                        <h3><i class="fas fa-file-alt me-2"></i>No Proposals Generated Yet</h3>
                        <p>Generate your first proposal documents to get started.</p>
                        <a href="/generate-proposal/{{ project.id }}" class="btn btn-success">Generate Proposals</a>
                    </div>
                `;
                return;
            }

            const proposalsHtml = data.proposals.map(proposal => {
                const typeNames = {
                    'technical': 'Technical Proposal',
                    'commercial': 'Commercial Proposal',
                    'implementation': 'Implementation Plan',
                    'architecture': 'Technical Architecture',
                    'company': 'Company Profile',
                    'compliance': 'Compliance Matrix',
                    'unknown': 'Proposal Document'
                };

                const typeIcons = {
                    'technical': 'fas fa-cogs',
                    'commercial': 'fas fa-dollar-sign',
                    'implementation': 'fas fa-rocket',
                    'architecture': 'fas fa-building',
                    'company': 'fas fa-building',
                    'compliance': 'fas fa-check-circle',
                    'unknown': 'fas fa-file-alt'
                };

                return `
                    <div class="proposal-card">
                        <div class="proposal-info">
                            <h4><i class="${typeIcons[proposal.type] || 'fas fa-file-alt'} me-2"></i>${typeNames[proposal.type] || 'Proposal Document'}</h4>
                            <p><strong>File:</strong> ${proposal.filename}</p>
                            <p><strong>Size:</strong> ${proposal.size} | <strong>Created:</strong> ${proposal.created}</p>
                        </div>
                        <div class="proposal-actions">
                            <a href="${proposal.download_url}" class="btn btn-success" download>
                                <i class="fas fa-download me-2"></i>Download
                            </a>
                            <button onclick="deleteProposal('${proposal.filename}')" class="btn btn-danger">
                                <i class="fas fa-trash me-2"></i>Delete
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            proposalsList.innerHTML = `
                <h3><i class="fas fa-clipboard-list me-2"></i>Generated Proposals (${data.proposal_count})</h3>
                ${proposalsHtml}
            `;

        } catch (error) {
            document.getElementById('proposalsList').innerHTML = `
                <div style="text-align: center; padding: 40px; color: #dc3545;">
                    <h3><i class="fas fa-exclamation-triangle me-2"></i>Error Loading Proposals</h3>
                    <p>${error.message}</p>
                    <button onclick="loadProposals()" class="btn btn-primary">Try Again</button>
                </div>
            `;
        }
    }

    async function deleteProposal(filename) {
        if (!confirm('Are you sure you want to delete this proposal?')) {
            return;
        }

        try {
            const response = await fetch(`/api/delete-proposal/${filename}`, {
                method: 'DELETE'
            });

            const result = await response.json();

            if (result.success) {
                alert('Proposal deleted successfully');
                loadProposals(); // Reload the list
            } else {
                alert('Error deleting proposal: ' + result.error);
            }

        } catch (error) {
            alert('Error deleting proposal: ' + error.message);
        }
    }

    // Load proposals when page loads
    document.addEventListener('DOMContentLoaded', loadProposals);
    </script>
</body>
</html>
