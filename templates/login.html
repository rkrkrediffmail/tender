<!-- templates/login.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Login - ITSS RFPplus</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/itss-theme.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #1F4397 0%, #10224c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        .brand-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand-logo img {
            max-width: 200px;
            height: auto;
        }
        .brand-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            color: #10224c;
            margin: 15px 0 5px 0;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1F4397 0%, #10224c 100%);
            border: none;
            font-weight: 500;
            padding: 12px 24px;
            border-radius: 8px;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #10224c 0%, #1F4397 100%);
            transform: translateY(-2px);
        }
        .form-control:focus {
            border-color: #1F4397;
            box-shadow: 0 0 0 0.2rem rgba(31, 67, 151, 0.25);
        }
        a {
            color: #1F4397;
        }
        a:hover {
            color: #FCAF17;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="login-card">
                    <div class="brand-logo">
                        <img src="/static/img/itss-logo.png" alt="ITSS Global" class="mb-3">
                        <h3 class="brand-title">RFP+</h3>
                        <p class="text-muted">AI-Powered RFP Analysis Platform</p>
                    </div>
                    
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    
                    <form method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Sign In
                        </button>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
